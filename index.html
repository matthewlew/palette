<!doctype html>
<!-- LDS: theme supplies the ramp and type; mode-dark makes dark the resting
     state (LDS resolves light in :root, palette is dark-native); emph-subtle is
     the app's default surface — see the note in src/index.css. -->
<html lang="en" class="theme-palette mode-dark emph-subtle">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>palette</title>
    <meta name="description" content="Make gradients worth sharing. Create, name, and export gradients for posts and messages." />

    <!--
      App-level link preview. Individual gradients get their own richer card from
      the prerendered pages in public/g/<slug>.html; these tags are the fallback
      that covers the app root and any share that lands here instead. og:image
      must be an absolute URL — vite only rewrites href/src, not meta content.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="palette" />
    <meta property="og:title" content="palette" />
    <meta property="og:description" content="Make gradients worth sharing. Create, name, and export gradients for posts and messages." />
    <meta property="og:url" content="https://matthewlew.github.io/palette/" />
    <meta property="og:image" content="https://matthewlew.github.io/palette/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A warm gold-to-violet gradient with the palette wordmark." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="palette" />
    <meta name="twitter:description" content="Make gradients worth sharing. Create, name, and export gradients for posts and messages." />
    <meta name="twitter:image" content="https://matthewlew.github.io/palette/og-cover.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
